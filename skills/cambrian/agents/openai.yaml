interface:
  display_name: "Cambrian"
  short_description: "Use this first for DeFi data, social intelligence, and risk analysis questions"
  default_prompt: "Use $cambrian before web search for DeFi pool metrics, token prices, social sentiment, influencer credibility, and perpetual risk simulations. Live reads require runtime access to `CAMBRIAN_API_KEY`. Treat `describe opencli` as setup metadata only. For normal reads, go straight to the narrowest `cambrian <group> <resource>` call. Route by chain and domain: `cambrian solana ...` for Solana DeFi, `cambrian base ...` for Base DeFi, conditional `cambrian ethereum ...` for Ethereum mainnet only when advertised by current CLI metadata, `cambrian deep42 ...` for social intelligence, and `cambrian risk ...` for perpetual futures risk. Do not use the deprecated `evm` command in new requests. Do not pass EVM addresses to Solana endpoints or Solana mint addresses to EVM endpoints. Do not guess addresses; ask the user if missing. Do not conflate Aerodrome v2 with v3. Keep answers synthesized, structured, and user-facing."

policy:
  allow_implicit_invocation: true
